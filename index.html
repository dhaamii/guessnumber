<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>GUESS THE NUMBER GAME</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: 100vh;
        width: 100wh;
        display: flex;
        align-items: center;
        background-color: rgb(0, 221, 255);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
      }

      .number {
        size: 10px;
      }

      button {
        cursor: pointer;
      }

      .counter {
        color: rgb(1, 43, 41);
        font-size: 40px;
        background-color: rgb(135, 135, 247);
      }

      .game {
        color: rgb(252, 156, 0);
        font-weight: bold;
      }

      .result {
        position: fixed;
        bottom: 10px;
        left: 5%;
        text-align: center;
        font-size: 50px;
        color: black;
      }

      .check {
        font-size: 25px;
        color: maroon;
      }
      .number,
      .show {
        color: maroon;
      }

      p,
      h1 {
        font-family: sans-serif;
        font-size: 50px;
        line-height: 1.3;
        width: 100%;
        padding: 30px;
        text-align: center;
        color: white;
      }

      input {
        color: white;
        width: 50%;
        font-size: 25px;
        height: 20%;
        background-color: white;
        height: 40px;
        width: 100px;
      }

      .restart-box,
      .restart {
        position: fixed;
        top: 50px;
        left: 30%;
        text-align: center;
        cursor: pointer;
        font-size: 50px;
        color: black;
      }
      button {
        color: white;
        width: 50%;
        font-size: 25px;
        height: 10%;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="restart-box">
      <button class="restart" id="restart">RESTART</button>
    </div>
    <p class="game" id="game">Guess the Number??</p>
    <input class="number" type="number" />
    <button class="check" id="check">Check</button>
    <p class="show" id="show">?</p>
    <h2 class="guess" id="guess">5 Attempts</h2>
    <p>Chance <box class="counter" id="counter">00</box></p>
    <p class="result" id="result">Try b/w 1 to 100</p>

    <script src="script.js"></script>
  </body>
</html>
